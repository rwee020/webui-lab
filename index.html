<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WKE 教務系統</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="WKE 教務系統">
          <span class="brand-badge">WKE</span>
          <div class="brand-text">
            <strong>WKE教務系統</strong>
            <small>Teacher Portal</small>
          </div>
        </div>

        <div class="topbar-actions">
          <button type="button" class="icon-button" aria-label="通知">🔔</button>
          <button type="button" class="login-button">登入</button>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar" aria-label="Sidebar navigation">
          <div class="sidebar-header">
            <h2>功能選單</h2>
          </div>
          <nav id="sidebarNav" class="sidebar-nav"></nav>
        </aside>

        <main class="main-panel">
          <section class="page-header">
            <div>
              <p class="eyebrow">教務管理</p>
              <h1 id="sectionTitle">儀表板</h1>
            </div>
            <button type="button" class="primary-button">新增公告</button>
          </section>

          <section id="cardsGrid" class="cards-grid" aria-live="polite"></section>
        </main>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
